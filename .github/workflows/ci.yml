name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src api scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Build corpus and evaluate the default extractor
        run: |
          python scripts/generate_dataset.py --n 120 --seed 20260101
          python scripts/run_eval.py --split test --extractors rules_layout --noise --quiet
      - name: Check the regression floor
        run: python scripts/check_regression.py

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify the package imports from a clean checkout
        run: python -c "import docintel, docintel.pipeline; print(docintel.__name__)"
      - name: Verify the demo documents parse
        run: |
          python scripts/generate_dataset.py --n 12
          python -m docintel.cli ingest data/demo/demo-classic-00.pdf
