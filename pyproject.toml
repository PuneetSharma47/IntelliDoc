[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intellidoc"
version = "0.9.0"
description = "Layout-aware document extraction pipeline for invoices and receipts with validation, confidence routing and human review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Puneet Sharma", email = "sharma.puneet.0407@gmail.com" }]
keywords = ["document-ai", "information-extraction", "ocr", "layoutlmv3", "invoice-processing"]

dependencies = [
    "pydantic>=2.5",
    "PyMuPDF>=1.23",
    "Pillow>=10.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
ml = ["torch>=2.1", "transformers>=4.40", "seqeval>=1.2.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3"]

[project.scripts]
docintel = "docintel.cli:main"

[project.urls]
Homepage = "https://github.com/puneet047/IntelliDoc"
Repository = "https://github.com/puneet047/IntelliDoc"
Issues = "https://github.com/puneet047/IntelliDoc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docintel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "benchmarks", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["docintel"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]  # FastAPI dependency marker in a default argument
"tests/*" = ["B008"]
